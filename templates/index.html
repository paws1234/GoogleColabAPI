<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101114">
    <title>Prompt Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='chat.js') }}" defer></script>
  </head>
  <body>
    <div class="app-shell" data-default-api-url="{{ default_api_url }}">
      <aside class="sidebar" aria-label="Chat history">
        <a class="brand" href="/" aria-label="Prompt Chat home">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>Prompt Chat</span>
        </a>
        <button class="new-chat-button" id="new-chat" type="button">
          <span aria-hidden="true">＋</span>
          <span>New chat</span>
          <span class="shortcut">⌘ K</span>
        </button>
        <p class="history-label">RECENT</p>
        <nav id="chat-list" class="chat-list" aria-label="Recent chats"></nav>
        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Ready when you are</span>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="mobile-brand">
            <span class="brand-mark" aria-hidden="true">✳</span>
            <span>Prompt Chat</span>
          </div>
          <div class="topbar-actions">
            <span class="model-label"><span class="model-dot"></span> Chat assistant</span>
            <button class="settings-button" id="open-settings" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/>
                <path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"/>
              </svg>
              <span>Settings</span>
            </button>
          </div>
          <button class="mobile-new-chat" id="mobile-new-chat" type="button" aria-label="Start a new chat">＋</button>
        </header>

        <section class="conversation" aria-label="Conversation">
          <div class="messages" id="messages" aria-live="polite"></div>
          <div class="composer-wrap">
            <div class="error-message" id="error-message" role="alert" hidden></div>
            <form class="composer" id="chat-form">
              <label class="sr-only" for="prompt-input">Message</label>
              <textarea id="prompt-input" rows="1" placeholder="Message Prompt Chat..." autocomplete="off"></textarea>
              <button class="send-button" id="send-button" type="submit" aria-label="Send message" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 19V5m-6 6 6-6 6 6"/>
                </svg>
              </button>
            </form>
            <p class="composer-note">AI can make mistakes. Check important information.</p>
          </div>
        </section>
      </main>
    </div>

    <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
      <form class="settings-form" id="settings-form">
        <div class="settings-heading">
          <div>
            <p class="settings-eyebrow">PREFERENCES</p>
            <h2 id="settings-title">Chat settings</h2>
          </div>
          <button class="dialog-close" id="close-settings" type="button" aria-label="Close settings">×</button>
        </div>
        <label class="settings-label" for="api-url">API endpoint URL</label>
        <input class="settings-input" id="api-url" name="api-url" type="url" placeholder="https://your-api.example/v1/chat/completions" required>
        <p class="settings-help">Use an OpenAI-compatible chat completions endpoint. It must resolve to a public IP address. This setting is saved only in this browser.</p>
        <p class="settings-error" id="settings-error" role="alert" hidden></p>
        <div class="settings-actions">
          <button class="reset-button" id="reset-api-url" type="button">Use default</button>
          <button class="save-button" type="submit">Save settings</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
